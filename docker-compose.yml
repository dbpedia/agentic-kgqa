services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-kgqa-api
    ports:
      - "8000:8000"
    environment:
      - NEF_REDIS_HOST=redis
      - NEF_REDIS_PORT=6379
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DBPEDIA_SPARQL_ENDPOINT=${DBPEDIA_SPARQL_ENDPOINT:-http://research.liberai.org:7878/sparql}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./resources:/app/resources
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agentic-kgqa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
